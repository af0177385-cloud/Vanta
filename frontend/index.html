<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda </title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">

</head>
<body >

<header>
    <h1>BIENVENIDO A VANTA</h1>

    <div class="control_busqueda">
        <input type="text" id="buscador" placeholder="Buscar producto">
        <span class="logo">⌕</span>
    </div>
</header>

<main>
    <div class="botones_principales">
        <button id="agregar_productos">Agregar producto</button>
        <button id="mostrar_productos">mostrar productos</button>
    </div>

    <form id="formulario_productos">
        <input type="file" id="input_imagen" accept="image/*">

        <input type="text" id="input_producto" placeholder="nombre del producto">

        <textarea name="" id="input_descripcion" placeholder="descripción del producto"></textarea>

        <input type="number" name="" id="input_precio" placeholder=" precio del producto">

        <button type="submit" id="guardar_producto">guardar</button>
        <button type="button" id="cancelar_producto">cancelar</button>
    </form>

    <section id="tarjetas">

    </section>
</main>

<footer>
    find
</footer>

<script src="script.js"></script>
</body>
</html>
